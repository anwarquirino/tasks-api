services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tasks -d tasks']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_DRIVER: pg
      DATABASE_URL: postgres://tasks:tasks@db:5432/tasks
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env ou no ambiente}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - '3000:3000'
    # Aplica as migrations pendentes antes de subir a API.
    command: sh -c "node dist/db/migrate.js && node dist/server.js"
    restart: unless-stopped

volumes:
  postgres-data:
